[project]
name = "pigwatch-workspace"
version = "0.1.0"
description = "Development tooling for the PigWatch monorepo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/python/*",
  "services/api",
]

[tool.uv.sources]
pigwatch-schemas = { workspace = true }
pigwatch-sources = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests", "services/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/dashboard", "simulators/godot"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
  "pigwatch_api",
  "pigwatch_schemas",
  "pigwatch_simulation",
  "pigwatch_sources",
  "pigwatch_vision",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = [
  "services/api/src",
  "packages/python/pigwatch-schemas/src",
  "packages/python/pigwatch-sources/src",
  "packages/python/pigwatch-simulation/src",
  "packages/python/pigwatch-vision/src",
]
