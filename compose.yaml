name: pigwatch

services:
  postgres:
    image: postgres:16-alpine
    # Non-secret, loopback-only defaults keep clean-checkout builds and smoke tests usable.
    # Override them through .env before using any shared development environment.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pigwatch}
      POSTGRES_USER: ${POSTGRES_USER:-pigwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pigwatch-local-only}
    ports:
      - "${PIGWATCH_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "${PIGWATCH_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
      - "${PIGWATCH_BIND_ADDRESS:-127.0.0.1}:${MQTT_WEBSOCKET_PORT:-9001}:9001"
    volumes:
      - ./infra/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      PIGWATCH_ENVIRONMENT: ${PIGWATCH_ENVIRONMENT:-development}
    ports:
      - "${PIGWATCH_BIND_ADDRESS:-127.0.0.1}:${PIGWATCH_API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "${PIGWATCH_BIND_ADDRESS:-127.0.0.1}:${PIGWATCH_DASHBOARD_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
