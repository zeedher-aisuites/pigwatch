[project]
name = "pigwatch-simulation"
version = "0.1.0"
description = "Deterministic synthetic environmental sources for PigWatch"
requires-python = ">=3.12"
dependencies = [
  "pigwatch-schemas",
  "pigwatch-sources",
  "pigwatch-telemetry",
  "pydantic>=2.10,<3",
]

[project.scripts]
pigwatch-simulator = "pigwatch_simulation.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pigwatch_simulation"]
