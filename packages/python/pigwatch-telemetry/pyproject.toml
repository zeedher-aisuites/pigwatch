[project]
name = "pigwatch-telemetry"
version = "0.1.0"
description = "PigWatch MQTT telemetry ingestion and PostgreSQL persistence"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "paho-mqtt>=2.1,<3",
  "pigwatch-schemas",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pigwatch_telemetry"]
