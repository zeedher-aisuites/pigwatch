name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.1"
      - name: Install workspace
        run: uv sync --all-packages --dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy services packages tests
      - name: Test
        run: uv run pytest

  dashboard:
    name: Dashboard quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "12.0.2"
      - name: Install workspace
        run: npm ci
      - name: Type check, test, and build
        run: npm run check

  containers:
    name: Container configuration and builds
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: pigwatch_ci
      POSTGRES_USER: pigwatch_ci
      POSTGRES_PASSWORD: ci-placeholder-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build M0 application images from a clean cache
        run: docker compose build --no-cache api dashboard
