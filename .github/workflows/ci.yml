name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.1"
      - name: Install workspace
        run: uv sync --all-packages --dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy services packages tests
      - name: Test
        run: uv run pytest -m "not integration"

  telemetry-integration:
    name: Telemetry integration
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: pigwatch_ci
      POSTGRES_USER: pigwatch_ci
      POSTGRES_PASSWORD: ci-placeholder-only
      DATABASE_URL: postgresql+asyncpg://pigwatch_ci:ci-placeholder-only@127.0.0.1:5432/pigwatch_ci
      PIGWATCH_TEST_DATABASE_URL: postgresql+asyncpg://pigwatch_ci:ci-placeholder-only@127.0.0.1:5432/pigwatch_ci
      PIGWATCH_TEST_MQTT_HOST: 127.0.0.1
      PIGWATCH_TEST_MQTT_PORT: "1883"
      PIGWATCH_TEST_COMPOSE_PROJECT: pigwatch-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.1"
      - name: Install workspace
        run: uv sync --all-packages --dev --locked
      - name: Start actual PostgreSQL and MQTT services
        run: docker compose -p pigwatch-ci up -d --wait --wait-timeout 120 postgres mqtt
      - name: Run database migrations
        run: uv run alembic -c services/api/alembic.ini upgrade head
      - name: Run telemetry integration tests
        run: uv run pytest -m integration
      - name: Capture service logs on failure
        if: failure()
        run: docker compose -p pigwatch-ci logs --no-color postgres mqtt
      - name: Stop integration services
        if: always()
        run: docker compose -p pigwatch-ci down --volumes

  dashboard:
    name: Dashboard quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@12.0.2
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "12.0.2"
      - name: Install workspace
        run: npm ci
      - name: Type check, test, and build
        run: npm run check

  containers:
    name: Container configuration and builds
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: pigwatch_ci
      POSTGRES_USER: pigwatch_ci
      POSTGRES_PASSWORD: ci-placeholder-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build application images from a clean cache
        run: docker compose build --no-cache api dashboard
